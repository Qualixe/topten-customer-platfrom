# Redirect all HTTP to HTTPS — covers both hostnames
server {
    listen 80;
    server_name sms.topten.com.bd sms-api.topten.com.bd;

    # Required for Certbot's HTTP-01 challenge (see the certbot service in
    # docker-compose.prod.yml) — this domain's DNS points straight at this
    # VPS with no Cloudflare in front, so unlike a Cloudflare Origin
    # Certificate (only trusted by Cloudflare's edge, never by a real
    # browser), a real publicly-trusted certificate is required here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# One Let's Encrypt certificate covers both hostnames (requested together
# as SANs — see the certonly command in the deploy README/runbook), stored
# under the first domain's name regardless of which server block below
# references it.
#
# ── Frontend: sms.topten.com.bd ────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name sms.topten.com.bd;

    ssl_certificate /etc/letsencrypt/live/sms.topten.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sms.topten.com.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 50M;

    # Campaign landing pages carry their verification token as a query
    # string (/campaign/{slug}?token=...) — keep it out of the access log.
    location /campaign/ {
        access_log off;
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── Backend API: sms-api.topten.com.bd ─────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name sms-api.topten.com.bd;

    ssl_certificate /etc/letsencrypt/live/sms.topten.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sms.topten.com.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 50M;

    # Customer-profile links carry a bearer-style secret token in the URL
    # path itself (/api/v1/public/customer-profile/{token}) — logging the
    # full request line would put that token in plaintext in the access log.
    # Matched before the general / block since it's the longer prefix.
    location /api/v1/public/customer-profile/ {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else — /api/v1/*, plus the /branding and /gift-images
    # StaticFiles mounts FastAPI serves directly at its root (see
    # backend/app/main.py) — all proxy straight to the backend.
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
