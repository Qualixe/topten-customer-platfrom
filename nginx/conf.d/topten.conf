# Redirect all HTTP to HTTPS — covers both hostnames
server {
    listen 80;
    server_name topten-bd.qualixe.com toptenbd-api.qualixe.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend: topten-bd.qualixe.com ────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name topten-bd.qualixe.com;

    # Cloudflare Origin Certificate — generate at
    # Cloudflare dashboard > SSL/TLS > Origin Server > Create Certificate,
    # save as nginx/certs/cloudflare-origin.pem and .key on the VPS (not
    # committed to git). Requires SSL/TLS mode = "Full (strict)" in
    # Cloudflare, since this cert is only trusted by Cloudflare, not
    # browsers directly.
    ssl_certificate /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 50M;

    # Campaign landing pages carry their verification token as a query
    # string (/campaign/{slug}?token=...) — keep it out of the access log.
    location /campaign/ {
        access_log off;
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── Backend API: toptenbd-api.qualixe.com ─────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name toptenbd-api.qualixe.com;

    ssl_certificate /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 50M;

    # Customer-profile links carry a bearer-style secret token in the URL
    # path itself (/api/v1/public/customer-profile/{token}) — logging the
    # full request line would put that token in plaintext in the access log.
    # Matched before the general / block since it's the longer prefix.
    location /api/v1/public/customer-profile/ {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else — /api/v1/*, plus the /branding and /gift-images
    # StaticFiles mounts FastAPI serves directly at its root (see
    # backend/app/main.py) — all proxy straight to the backend.
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
